<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>지하수 리모콘</title>
    
    <!-- 공통CSS -->
    <link rel="stylesheet" href="css/common.css" type="text/css">
    <link rel="stylesheet" href="css/contents.css" type="text/css">
</head>
<body>
    <div class="wrap login">
        <div class="app-main">
            <div id="header" class="app-header">
                <button class="app-header__button header-back" title="이전 화면" type="button"></button>
            </div>
            <!-- //app-header -->
    
            <div id="content" class="app-content">
                <a href="#" class="main-logo">
                    <img src="images/logo.png" alt="지하수리모콘 로고">
                </a>
                <div class="login-box">
                    <form class="login--form">
                        <div class="input">
                            <div class="input--form">
                                <input type="text" class="input--element" title="아이디 입력" placeholder="아이디">
                                <button type="button" class="input-remove--btn" title="텍스트 삭제" ></button>
                            </div>
                        </div>
                        <div class="input">
                            <div class="input--form">
                                <input type="password" class="input--element" title="패스워드 입력" placeholder="패스워드">
                                <button type="button" class="input-remove--btn" title="텍스트 삭제" ></button>
                            </div>
                        </div>
                    </form>
                    <p class="login-guide">※ 시스템에 대한 안내문구가 들어갈 예정입니다.</p>
                </div>
            </div>
            <!-- //app-main -->
        </div>

        <div id="footer" class="app-footer app-footer--button">
            <div class="button-wrap">
                <button class="login--btn" type="button">로그인</button>
            </div>
        </div>
        <!-- //app-footer -->

    </div>
</body>
</html>
