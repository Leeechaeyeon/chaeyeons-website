<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>지하수 리모콘</title>
    
    <!-- 공통CSS -->
    <link rel="stylesheet" href="css/common.css" type="text/css">
    <link rel="stylesheet" href="css/contents.css" type="text/css">
</head>
<body>
    <div class="wrap">
        <div class="app-main">
            <div id="header" class="app-header">
                <button class="app-header__button header-back" title="이전 화면" type="button"></button>
            </div>
            <!-- //app-header -->
            <div id="content" class="app-content">
                <a class="main-logo" href="#">
                    <img src="images/logo.png" alt="지하수리모콘 로고">
                </a>
                <div class="main-content--title">
                    <i class="activation is--active"></i>
                    <span>가동</span>
                    <i class="activation"></i>
                    <span>비가동</span>
                </div>
                <div class="main-content">
                    <ul class="operation--content">
                        <li class="operation-item item01 active">
                            <div class="icon-box">
                                <i class="ico-remote water"></i>
                                <i class="activation is--active"></i>
                            </div>
                            <h2>신리-1</h2>
                            <ol>
                                <li>
                                    <p>누적시간 : -</p>
                                </li>
                                <li>
                                    <p>시작시간 :</p>
                                    <p>-</p>
                                </li>
                                <li>
                                    <p>공급량 : - 톤
                                    </p>
                                </li>
                            </ol>
                            <button class="pump--btn" type="button">펌프가동</button>
                            <button class="water--btn" type="button">용수지원</button>
                        </li>
                        <li class="operation-item item02">
                            <div class="icon-box">
                                <i class="ico-remote"></i>
                                <i class="activation"></i>
                            </div>
                            <h2>신리-2</h2>
                            <ol>
                                <li>
                                    <p>누적시간 : -</p>
                                </li>
                                <li>
                                    <p>시작시간 :</p>
                                    <p>-</p>
                                </li>
                                <li>
                                    <p>공급량 : - 톤
                                    </p>
                                </li>
                            </ol>
                            <button class="pump--btn" type="button" disabled>펌프가동</button>
                            <button class="water--btn" type="button" disabled>용수지원</button>
                        </li>
                        <li class="operation-item item03">
                            <div class="icon-box">
                                <i class="ico-remote water"></i>
                                <i class="activation"></i>
                            </div>
                            <h2>양곡-1</h2>
                            <ol>
                                <li>
                                    <p>누적시간 : -</p>
                                </li>
                                <li>
                                    <p>시작시간 :</p>
                                    <p>-</p>
                                </li>
                                <li>
                                    <p>공급량 : - 톤
                                    </p>
                                </li>
                            </ol>
                            <button class="pump--btn" type="button">펌프가동</button>
                        </li>
                        <li class="operation-item item04">
                            <div class="icon-box">
                                <i class="ico-remote"></i>
                                <i class="activation"></i>
                            </div>
                            <h2>양곡-2</h2>
                            <ol>
                                <li>
                                    <p>누적시간 : -</p>
                                </li>
                                <li>
                                    <p>시작시간 :</p>
                                    <p>-</p>
                                </li>
                                <li>
                                    <p>공급량 : - 톤
                                    </p>
                                </li>
                            </ol>
                            <button class="pump--btn" type="button" disabled>펌프가동</button>
                        </li>
                    </ul>
                </div>
            </div>
            <!-- //app-main -->
        </div>
    </div>
</body>
</html>
