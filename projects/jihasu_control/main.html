<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>지하수 리모콘</title>
    
    <!-- 공통CSS -->
    <link rel="stylesheet" href="css/common.css" type="text/css">
    <link rel="stylesheet" href="css/contents.css" type="text/css">
</head>
<body>
    <div class="wrap">
        <div class="app-main">
            <div id="header" class="app-header">
                <button class="app-header__button header-back" title="이전 화면" type="button"></button>
            </div>
            <!-- //app-header -->    
            <div id="content" class="app-content">
                <a class="main-logo" href="#">
                    <img src="images/logo.png" alt="지하수리모콘 로고">
                </a>
                <div class="weather-box">
                    <div class="weather-box__top">
                        <i class="ico-weather thunder"></i>
                        <div class="weather-box__content">
                            <p>
                                2024. 10. 10. 목요일<br>
                                오후 4:24
                            </p>
                            <strong>21º</strong>
                            <span>천둥 / 소나기</span>
                        </div>
                    </div>
                    <div class="weather-box__bottom">
                        <ul>
                            <li>
                                <img src="images/ico-precip.png" alt="강수확률"></img>
                                <p>60%</p>
                                <p class="blue">강수확률</p>
                            </li>
                            <li>
                                <img src="images/ico-humidity.png" alt="습도"></img>
                                <p>50%</p>
                                <p class="blue">습도</p>
                            </li>
                            <li>
                                <img src="images/ico-airvolume.png" alt="풍량"></img>
                                <p>12 km/h</p>
                                <p class="blue">풍량</p>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="banner-box">
                    <div class="banner-box__content">
                        <p>
                            지하수 동작관리, <br>
                            스마트하게 편리하게!
                        </p>
                        <button type="button">지하수 사용하기</button>
                    </div>
                </div>
            </div>
            <!-- //app-main -->
        </div>
        <!-- // app-main -->
        <div id="footer" class="app-footer app-footer--main">
            <div class="footer-partner">
                <ul>
                    <li>
                        <a href="#"></a>
                    </li>
                    <li>
                        <a href="#"></a>
                    </li>
                    <li>
                        <a href="#"></a>
                    </li>
                </ul>
            </div>
            <div class="footer-content">
                <p>
                    [08376] 서울특별시 구로구 디지털로 33길 55, 901호<br>
                    TEL : 02)6330-2500 | FAX : 02)6330-2507
                </p>
                <p>Copyright(c) 지오그린21. All Rights reserved.</p>
            </div>
        </div>
        <!-- //app-footer -->
    </div>
</body>
</html>
